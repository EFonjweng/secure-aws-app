<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First AWS Static Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom right, #0078d7, #00c6ff);
      color: white;
      text-align: center;
      padding: 100px 20px;
      margin: 0;
    }
    h1 {
      font-size: 2.5em;
      margin-bottom: 0.5em;
    }
    p {
      font-size: 1.2em;
      max-width: 600px;
      margin: 0 auto 2em;
    }
    a.button {
      display: inline-block;
      background-color: white;
      color: #0078d7;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.3s;
    }
    a.button:hover {
      background-color: #e0f0ff;
    }
  </style>
</head>
<body>
  <h1>🚀 Welcome to My AWS Static Website!</h1>
  <p>
    Congratulations! Your S3 bucket is now hosting a static website.
  </p>
  <a href="error.html" class="button">Test Error Page</a>
</body>
</html>
